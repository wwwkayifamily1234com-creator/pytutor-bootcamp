<!DOCTYPE html>
<html>
    <head>
        <title>
            my1st-project
        </title>
        <style>
    .SUN-BUT{
        background-color: red;
        color:white;
        border: none;
        padding: 12px;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
        margin-right: 8px;
        transition: background-color 0.15s;


    }
    .SUN-BUT:hover{
        background-color: rgb(115, 15, 15);
        color: red;
    }
    .join-but{
        background-color: white;
        color: rgb(70, 170, 242);
        border-style: solid;
        padding: 11px;
        border-color: rgb(70, 170, 242);
        border-width:1px;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.15s;
        margin-right: 8px;

    }
    .join-but:hover{
        background-color: blue;
        color: white;


    }
    .tweet-but{
        background-color: rgb(54, 134, 238);
        color: white;
        padding: 11px;
        border-radius: 16px;
        border: none;
        font-weight: bold;
        cursor: pointer;



    }
    .tweet-but:hover{
        box-shadow: 10px 5px 20px rgba(0,0, 0, 0.1);
    }
</style>

    </head>
  <body>
    <button class="SUN-BUT">
    SUBSCRIBE
</button>
<button class="join-but">
    JOIN
</button>
<button class="tweet-but">
    Tweet
</button>
  </body>
</html>
